<style>
  :root{
    --ink:#effdff;
    --dim:rgba(196,236,250,.74);
    --edge:rgba(150,235,255,.34);
    --glow-soft:0 0 2px rgba(0,8,20,.55), 0 0 16px rgba(70,210,255,.34), 0 0 46px rgba(20,120,255,.26);
    --serif:'Marcellus','Times New Roman',serif;
    --sans:'Jost','Helvetica Neue',Arial,sans-serif;
    --fun:'Righteous','Jost','Helvetica Neue',Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{background:#01040a;color:var(--ink);-webkit-text-size-adjust:100%}
  body{font-family:var(--sans);font-weight:300;overflow-x:hidden;min-height:100vh;-webkit-font-smoothing:antialiased}

  /* fixed WebGL night ocean */
  #sea{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
  #vignette{position:fixed;inset:0;z-index:1;pointer-events:none;
    background:radial-gradient(125% 95% at 50% 46%,rgba(0,0,0,0) 56%,rgba(0,4,12,.55) 100%)}
  #veil{position:fixed;inset:0;z-index:10;background:#01040a;pointer-events:none}
  .no-gl body{background:radial-gradient(90% 60% at 30% 25%,#0a1a33 0%,#02060f 60%,#01040a 100%)}
  .no-gl #sea{display:none}

  /* scroll distance for the three-section flow */
  #scroller{height:420vh;position:relative}

  .layer{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;
    text-align:center;padding:0 6vw;pointer-events:none}

  /* ---- section 1: surface ---- */
  #hero{justify-content:flex-start;padding-top:clamp(56px,12vh,140px)}
  .logo{display:block;width:min(66vw,620px);height:auto;filter:drop-shadow(0 0 12px rgba(60,205,255,.30))}
  .welcome{margin-top:clamp(18px,3.4vh,36px);font-family:var(--serif);font-weight:400;
    font-size:clamp(1.05rem,2.3vw,1.6rem);letter-spacing:.24em;padding-left:.24em;text-shadow:var(--glow-soft)}
  .sub{margin-top:.9rem;font-size:clamp(.95rem,1.5vw,1.12rem);letter-spacing:.14em;padding-left:.14em;
    color:var(--dim);text-shadow:0 0 2px rgba(0,8,20,.6),0 0 18px rgba(60,190,255,.28)}

  /* ---- section 2: track release ---- */
  #track{justify-content:center;padding:0 6vw;visibility:hidden;opacity:0;overflow:hidden}
  .track-card{position:relative;z-index:1;width:min(900px,92vw);padding:clamp(42px,7vw,78px) clamp(24px,6vw,72px);border:1px solid rgba(130,235,255,.25);border-radius:34px 34px 58px 34px;background:linear-gradient(145deg,rgba(3,18,32,.56),rgba(0,5,14,.26));box-shadow:0 0 0 1px rgba(120,230,255,.05) inset,0 0 80px rgba(0,120,255,.12),inset 0 0 55px rgba(80,220,255,.045);backdrop-filter:blur(3px)}
  .track-card::before,.track-card::after{content:"";position:absolute;pointer-events:none}
  .track-card::before{inset:12px;border:1px solid rgba(150,240,255,.08);border-radius:26px 26px 46px 26px}
  .track-card::after{width:140px;height:140px;right:-48px;top:-58px;border-radius:50%;border:1px solid rgba(140,235,255,.18);box-shadow:0 0 40px rgba(60,210,255,.12)}
  .track-title{position:relative;font-family:var(--fun);font-weight:400;font-size:clamp(2.8rem,10vw,7rem);line-height:1;
    letter-spacing:.05em;padding-left:.05em;color:#f3ffff;
    text-shadow:0 0 2px rgba(0,8,20,.5),0 0 22px rgba(80,215,255,.36),0 0 74px rgba(10,120,255,.32)}
  .credit{margin-top:clamp(20px,3.4vh,34px);display:flex;flex-direction:column;align-items:center;gap:.45rem}
  .credit span{font-size:.88rem;letter-spacing:.16em;padding-left:.16em;color:var(--dim)}
  .credit strong{font-family:var(--serif);font-weight:400;font-size:clamp(1.3rem,2.3vw,1.75rem);
    letter-spacing:.14em;padding-left:.14em;text-shadow:var(--glow-soft)}
  .listen{margin-top:clamp(30px,5.6vh,58px);display:flex;flex-wrap:wrap;justify-content:center;gap:14px}
  .pill{pointer-events:auto;display:inline-flex;align-items:center;justify-content:center;min-width:136px;
    padding:.85em 1.8em;border:1px solid var(--edge);border-radius:999px;color:var(--ink);text-decoration:none;
    font-size:.9rem;letter-spacing:.14em;background:transparent;
    transition:border-color .4s,box-shadow .4s,text-shadow .4s,color .4s}
  .pill:hover,.pill:focus-visible{border-color:rgba(120,240,255,.95);color:#fff;
    box-shadow:0 0 16px rgba(40,215,255,.42),0 0 46px rgba(0,140,255,.22),inset 0 0 14px rgba(60,220,255,.14);
    text-shadow:0 0 10px rgba(130,242,255,.85)}
  .pill:focus-visible{outline:2px solid rgba(160,245,255,.9);outline-offset:4px}

  /* ---- section 3: contact over the star field (the stars are drawn by the WebGL scene) ---- */
  #contact{
    justify-content:flex-end;
    align-items:flex-start;
    text-align:left;
    padding:0 6vw clamp(34px,7vh,72px);
    visibility:hidden;
    opacity:0;
    overflow:hidden;
  }
  /* a soft shadow in the bottom-left corner keeps the links readable over the stars (not a container) */
  #contact::before{
    content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
    background:radial-gradient(70% 60% at 0% 100%,rgba(0,2,8,.68),rgba(0,2,8,0) 72%);
  }
  /* no-WebGL fallback only: the previous static star dots */
  .no-gl #contact{background:#000106}
  .no-gl #contact::before{
    background:
      radial-gradient(circle at 8% 12%,rgba(255,255,255,.72) 0 1px,transparent 2px),
      radial-gradient(circle at 18% 34%,rgba(190,225,255,.55) 0 1px,transparent 2px),
      radial-gradient(circle at 31% 16%,rgba(255,255,255,.65) 0 1.2px,transparent 2.4px),
      radial-gradient(circle at 44% 30%,rgba(170,220,255,.52) 0 1px,transparent 2px),
      radial-gradient(circle at 57% 11%,rgba(255,255,255,.75) 0 1px,transparent 2px),
      radial-gradient(circle at 71% 25%,rgba(190,230,255,.6) 0 1.2px,transparent 2.4px),
      radial-gradient(circle at 86% 9%,rgba(255,255,255,.7) 0 1px,transparent 2px),
      radial-gradient(circle at 96% 38%,rgba(170,220,255,.55) 0 1px,transparent 2px),
      radial-gradient(circle at 11% 57%,rgba(180,225,255,.58) 0 1.2px,transparent 2.4px),
      radial-gradient(circle at 24% 78%,rgba(255,255,255,.65) 0 1px,transparent 2px),
      radial-gradient(circle at 39% 61%,rgba(190,230,255,.48) 0 1px,transparent 2px),
      radial-gradient(circle at 52% 84%,rgba(255,255,255,.7) 0 1.2px,transparent 2.4px),
      radial-gradient(circle at 66% 66%,rgba(170,220,255,.58) 0 1px,transparent 2px),
      radial-gradient(circle at 79% 88%,rgba(255,255,255,.62) 0 1px,transparent 2px),
      radial-gradient(circle at 91% 70%,rgba(190,230,255,.54) 0 1.2px,transparent 2.4px),
      radial-gradient(ellipse at 50% 45%,rgba(18,45,76,.22),transparent 58%),
      #000106;;
    box-shadow:inset 0 0 180px rgba(0,0,0,.96);
  }
  .contact-inner{position:relative;z-index:1;max-width:620px}
  .contact-kicker{font-family:var(--fun);font-size:clamp(1.1rem,2.2vw,1.45rem);letter-spacing:.12em;color:var(--ink);text-shadow:0 0 18px rgba(100,210,255,.34)}
  .contact-title{margin-top:.55rem;font-family:var(--serif);font-weight:400;font-size:clamp(2rem,5vw,4rem);letter-spacing:.06em;text-shadow:0 0 2px rgba(0,8,20,.5),0 0 22px rgba(80,215,255,.28)}
  .contact-details{margin-top:1.25rem;display:flex;flex-direction:column;gap:.65rem;font-size:.92rem;letter-spacing:.08em;color:var(--dim)}
  .contact-details a{pointer-events:auto;color:var(--ink);text-decoration:none;word-break:break-word;cursor:pointer;transition:color .35s,text-shadow .35s}
  .contact-details a:hover,.contact-details a:focus-visible{color:#fff;text-shadow:0 0 12px rgba(120,235,255,.7)}

  @media (max-width:520px){
    .pill{min-width:0;flex:1 1 42%}
    .listen{width:100%;max-width:340px}
  }

  /* 2026 refresh */
  body{font-family:var(--fun);}
  #track{isolation:isolate;padding:0 5vw;}
  #track::before{content:"";position:absolute;inset:-2%;z-index:-3;background-image:linear-gradient(rgba(0,8,30,.10),rgba(0,3,16,.34)),url("assets/indha-nodi-underwater.png");background-size:cover;background-position:center;opacity:.96;transform:scale(1.025);}
  #track::after{content:"";position:absolute;inset:0;z-index:-2;background:radial-gradient(ellipse at center,transparent 28%,rgba(0,3,16,.18) 70%,rgba(0,2,10,.58) 100%);pointer-events:none;}
  .track-card{width:min(920px,92vw);padding:clamp(36px,6vw,70px) clamp(22px,5vw,64px);border:0;border-radius:48% 52% 44% 56% / 58% 42% 58% 42%;background:radial-gradient(ellipse at 50% 45%,rgba(1,22,45,.58),rgba(1,10,28,.32) 64%,rgba(0,8,20,.12));box-shadow:0 0 90px rgba(24,194,255,.18),inset 0 0 60px rgba(92,235,255,.08);backdrop-filter:blur(2px);}
  .track-card::before{inset:9px;border:1px solid rgba(160,244,255,.20);border-radius:inherit;filter:drop-shadow(0 0 12px rgba(80,220,255,.18));}
  .track-card::after{display:none;}
  .track-title{font-size:clamp(3.3rem,11vw,8rem);text-shadow:0 0 5px #06274a,0 0 24px rgba(84,235,255,.72),0 0 75px rgba(40,110,255,.55);}
  .credit span{font-size:clamp(.95rem,1.8vw,1.15rem)}
  .credit strong{font-family:var(--fun);font-size:clamp(1.55rem,3vw,2.2rem)}
  .pill{font-size:clamp(.9rem,1.6vw,1.05rem);background:rgba(0,16,36,.28);backdrop-filter:blur(5px)}
  .contact-inner{max-width:760px;width:min(760px,88vw)}
  .contact-kicker{font-size:clamp(1.5rem,3vw,2.25rem)}
  .contact-details{font-size:clamp(1.15rem,2.2vw,1.55rem);gap:.85rem}
  .footer-brand{margin-top:clamp(22px,4vh,42px);width:min(560px,82vw)}
  .footer-brand img{display:block;width:100%;height:auto;filter:drop-shadow(0 0 14px rgba(65,220,255,.45));}
  @media(max-width:700px){#track::before{background-position:center center}.track-card{border-radius:38px 58px 42px 64px;padding:34px 18px}#contact{padding:0 7vw max(30px,env(safe-area-inset-bottom));}.contact-details{gap:.7rem}}


  /* V4 · living reef motion */
  #track::before{animation:reefDrift 16s ease-in-out infinite alternate;will-change:transform,background-position,filter;filter:saturate(1.06) brightness(.98)}
  #track::after{background:radial-gradient(ellipse at center,transparent 25%,rgba(0,3,16,.16) 68%,rgba(0,2,10,.62) 100%),linear-gradient(112deg,transparent 12%,rgba(116,235,255,.08) 31%,transparent 46%,rgba(105,178,255,.055) 60%,transparent 74%);background-size:auto,180% 100%;animation:lightSweep 10s ease-in-out infinite alternate}
  .ocean-fx{position:absolute;inset:0;z-index:-1;overflow:hidden;pointer-events:none;perspective:800px}
  .ocean-fx::before,.ocean-fx::after{content:"";position:absolute;inset:-15%;pointer-events:none}
  .ocean-fx::before{background:radial-gradient(ellipse at 22% 22%,rgba(98,235,255,.16),transparent 24%),radial-gradient(ellipse at 78% 32%,rgba(130,110,255,.12),transparent 25%);filter:blur(22px);animation:currentGlow 9s ease-in-out infinite alternate}
  .ocean-fx::after{background:linear-gradient(104deg,transparent 24%,rgba(150,245,255,.07) 36%,transparent 46%);transform:skewX(-10deg);animation:rayCurrent 12s ease-in-out infinite alternate}
  .bubble{position:absolute;bottom:-12vh;border:1px solid rgba(190,250,255,.38);border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.28),rgba(90,220,255,.05) 42%,transparent 66%);box-shadow:inset 0 0 7px rgba(170,245,255,.18),0 0 9px rgba(60,210,255,.12);opacity:0;animation:bubbleRise var(--dur) linear var(--delay) infinite;will-change:transform,opacity}
  .track-card{animation:cardFloat 6.5s ease-in-out infinite;will-change:transform}
  .track-title{animation:titlePulse 4.8s ease-in-out infinite}
  .listen .pill{backdrop-filter:blur(4px);background:rgba(0,18,38,.12)}
  @keyframes reefDrift{0%{transform:scale(1.055) translate3d(-.7%,-.5%,0);background-position:48% 50%;filter:saturate(1.02) brightness(.94)}100%{transform:scale(1.09) translate3d(.8%,.7%,0);background-position:52% 48%;filter:saturate(1.12) brightness(1.03)}}
  @keyframes lightSweep{0%{background-position:center,10% 0}100%{background-position:center,90% 0}}
  @keyframes currentGlow{0%{transform:translate3d(-2%,1%,0) scale(1)}100%{transform:translate3d(3%,-2%,0) scale(1.08)}}
  @keyframes rayCurrent{0%{transform:translateX(-7%) skewX(-10deg);opacity:.45}100%{transform:translateX(8%) skewX(-6deg);opacity:.85}}
  @keyframes bubbleRise{0%{transform:translate3d(0,0,0) scale(.65);opacity:0}10%{opacity:.5}55%{transform:translate3d(var(--sway),-58vh,0) scale(.9);opacity:.38}100%{transform:translate3d(calc(var(--sway) * -.5),-120vh,0) scale(1.15);opacity:0}}
  @keyframes cardFloat{0%,100%{transform:translate3d(0,0,0) rotate(-.15deg)}50%{transform:translate3d(0,-8px,0) rotate(.15deg)}}
  @keyframes titlePulse{0%,100%{text-shadow:0 0 5px #06274a,0 0 24px rgba(84,235,255,.62),0 0 75px rgba(40,110,255,.45)}50%{text-shadow:0 0 6px #06274a,0 0 32px rgba(110,244,255,.82),0 0 95px rgba(70,120,255,.62)}}
  @media(max-width:700px){#track::before{animation-duration:20s}.track-card{animation-duration:7.5s}.bubble:nth-child(n+13){display:none}}
  @media(prefers-reduced-motion:reduce){#track::before,#track::after,.ocean-fx::before,.ocean-fx::after,.bubble,.track-card,.track-title{animation:none!important}}

</style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

<script>
(function () {
'use strict';

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const canvas = document.getElementById('sea');

/* Scroll-driven scene state. GSAP tweens these values, the render loop reads them. */
const S = { pitch: 0.075, yaw: 0, camY: 2.3, amp: 1, bio: 1, reflect: 1, underwater: 0, stars: 0 };
const ptr = { x: 0, y: 0, tx: 0, ty: 0 };

/* ============================================================
   GLSL
   ============================================================ */

const GLSL_NOISE = `
float hash21(vec2 p){
  vec3 p3 = fract(vec3(p.xyx) * 0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}
float hash31(vec3 p3){
  p3 = fract(p3 * 0.1031);
  p3 += dot(p3, p3.zyx + 31.32);
  return fract((p3.x + p3.y) * p3.z);
}
vec3 hash33(vec3 p3){
  p3 = fract(p3 * vec3(0.1031, 0.1030, 0.0973));
  p3 += dot(p3, p3.yxz + 33.33);
  return fract((p3.xxy + p3.yxx) * p3.zyx);
}
float vnoise(vec2 p){
  vec2 i = floor(p);
  vec2 f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  float a = hash21(i);
  float b = hash21(i + vec2(1.0, 0.0));
  float c = hash21(i + vec2(0.0, 1.0));
  float d = hash21(i + vec2(1.0, 1.0));
  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}
float vnoise3(vec3 p){
  vec3 i = floor(p);
  vec3 f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  float n000 = hash31(i);
  float n100 = hash31(i + vec3(1.0, 0.0, 0.0));
  float n010 = hash31(i + vec3(0.0, 1.0, 0.0));
  float n110 = hash31(i + vec3(1.0, 1.0, 0.0));
  float n001 = hash31(i + vec3(0.0, 0.0, 1.0));
  float n101 = hash31(i + vec3(1.0, 0.0, 1.0));
  float n011 = hash31(i + vec3(0.0, 1.0, 1.0));
  float n111 = hash31(i + vec3(1.0, 1.0, 1.0));
  return mix(mix(mix(n000, n100, f.x), mix(n010, n110, f.x), f.y),
             mix(mix(n001, n101, f.x), mix(n011, n111, f.x), f.y), f.z);
}
float fbm2(vec2 p){
  float v = 0.0;
  float a = 0.5;
  for (int i = 0; i < 4; i++){
    v += a * vnoise(p);
    p = p * 2.03 + vec2(17.1, 9.7);
    a *= 0.5;
  }
  return v / 0.9375;
}
float fbm2b(vec2 p){
  return (0.65 * vnoise(p) + 0.35 * vnoise(p * 2.11 + vec2(7.3, 3.9)));
}
float fbm3(vec3 p){
  float v = 0.0;
  float a = 0.5;
  for (int i = 0; i < 4; i++){
    v += a * vnoise3(p);
    p = p * 2.03 + vec3(11.7, 5.3, 8.1);
    a *= 0.5;
  }
  return v / 0.9375;
}
vec3 finish(vec3 c){
  c = 1.0 - exp(-1.25 * c);
  return pow(c, vec3(0.4545));
}
`;

/* Night sky: airglow gradient, Milky Way band with dust lanes, three star layers, distant headlands.
   The same function paints the dome and is sampled by the water for reflections. */
const GLSL_SKY = `
uniform float uTime;
uniform vec3 uGalN;
uniform vec3 uGalC;
uniform vec3 uHorizon;
uniform vec3 uZenith;
uniform float uUnderwater;
uniform float uDepth;
uniform float uStars;

vec3 skyBase(float h){
  float hh = clamp(h, 0.0, 1.0);
  vec3 c = mix(uHorizon, uZenith, pow(hh, 0.45));
  c += vec3(0.0015, 0.0070, 0.0100) * exp(-hh * 10.0);
  return c;
}

float gauss(float x){ return exp(-x * x); }

float landMask(vec3 dir){
  float az = atan(dir.x, -dir.z);
  float h = 0.0;
  h += 0.014 * gauss((az - 0.55) / 0.18);
  h += 0.008 * gauss((az - 0.85) / 0.30);
  h += 0.018 * gauss((az + 0.85) / 0.14);
  h += 0.009 * gauss((az + 0.60) / 0.28);
  h *= 0.75 + 0.5 * vnoise(vec2(az * 70.0, 3.0));
  float shape = smoothstep(0.0004, 0.0025, h);
  return shape * (1.0 - smoothstep(h - 0.0009, h + 0.0009, dir.y));
}

vec3 starLayer(vec3 dir, float scale, float dens, float size, float bright){
  vec3 p = dir * scale;
  vec3 id = floor(p);
  vec3 f = fract(p) - 0.5;
  vec3 h = hash33(id);
  float present = step(hash31(id + 13.7), dens);
  vec3 o = (h - 0.5) * 0.5;
  float d = length(f - o);
  float mag = pow(hash31(id + 41.3), 3.0);
  float sz = size * (0.55 + 0.45 * mag);
  float s = 1.0 - smoothstep(0.0, sz, d);
  s *= s;
  float tw = 0.82 + 0.18 * sin(uTime * (1.5 + 3.0 * h.x) + h.y * 60.0);
  vec3 tint = mix(vec3(0.68, 0.80, 1.0), vec3(1.0, 0.86, 0.72), h.z);
  return tint * s * present * (0.18 + 1.6 * mag) * bright * tw;
}

/* The water column seen from inside: teal light near the surface that drains to blue-black with depth. */
vec3 waterColumn(vec3 dir){
  vec3 shallow = vec3(0.0006, 0.0130, 0.0320);
  vec3 abyss   = vec3(0.00012, 0.0010, 0.0032);
  vec3 c = mix(shallow, abyss, smoothstep(0.0, 0.85, uDepth));
  float lit = smoothstep(-0.5, 1.0, dir.y) * (1.0 - smoothstep(0.0, 0.9, uDepth));
  return c * (0.45 + 1.25 * lit);
}

/* Drifting plankton motes: five parallax layers fixed in the world, so they stream upward as the camera sinks. */
vec3 marineSnow(vec3 rd, float tMax){
  vec3 acc = vec3(0.0);
  float fz = max(-rd.z, 0.0);
  float ok = smoothstep(0.18, 0.40, fz);
  for (int i = 0; i < 5; i++){
    float fi = float(i);
    float depth = 3.5 * pow(1.55, fi);
    float t = depth / max(fz, 0.05);
    float vis = step(t, tMax);
    vec2 uv = cameraPosition.xy + rd.xy * t;
    uv.y += uTime * 0.06;
    float cs = depth * 0.17;
    vec2 g = uv / cs;
    vec2 id = floor(g);
    vec2 f = fract(g) - 0.5;
    float h = hash21(id + fi * 37.1);
    vec2 o = (vec2(hash21(id + fi * 11.7 + 3.3), hash21(id + fi * 23.9 + 9.1)) - 0.5) * 0.5;
    float d = length(f - o) * cs;
    float r = depth * 0.0048 + 0.006;
    float s = 1.0 - smoothstep(0.0, r, d);
    s *= s;
    float on = step(0.45, h);
    float tw = 0.55 + 0.45 * sin(uTime * (0.8 + 2.0 * h) + h * 50.0);
    vec3 tint = mix(vec3(0.22, 0.60, 0.95), vec3(0.65, 0.97, 1.0), fract(h * 7.3));
    acc += tint * s * on * vis * tw * exp(-depth * 0.05);
  }
  return acc * ok;
}

/* A few larger stars with a soft halo, for the third stage. */
vec3 starGlow(vec3 dir, float scale, float dens, float bright){
  vec3 p = dir * scale;
  vec3 id = floor(p);
  vec3 f = fract(p) - 0.5;
  vec3 h = hash33(id);
  float present = step(hash31(id + 71.3), dens);
  vec3 o = (h - 0.5) * 0.4;
  float d = length(f - o);
  float mag = pow(hash31(id + 41.3), 2.0);
  float core = 1.0 - smoothstep(0.0, 0.035 + 0.03 * mag, d);
  float halo = exp(-d * mix(34.0, 15.0, mag)) * (1.0 - smoothstep(0.18, 0.30, d));
  float tw = 0.72 + 0.28 * sin(uTime * (0.8 + 2.4 * h.x) + h.y * 60.0);
  vec3 tint = mix(vec3(0.55, 0.75, 1.0), vec3(0.86, 0.93, 1.0), h.z);
  tint = mix(tint, vec3(1.0, 0.84, 0.66), step(0.9, h.x));
  return tint * (core * (0.7 + 2.0 * mag) + halo * (0.06 + 0.45 * mag)) * present * bright * tw;
}

/* Third stage: near-black, thousands of stars in four layers, drifting very slowly. */
vec3 starField(vec3 dir){
  float a = uTime * 0.012;
  vec3 d = vec3(cos(a) * dir.x - sin(a) * dir.z, dir.y, sin(a) * dir.x + cos(a) * dir.z);
  vec3 st = vec3(0.0);
  st += starGlow(d,  30.0, 0.035, 1.8);
  st += starLayer(d,  70.0, 0.075, 0.20, 1.25);
  st += starLayer(d, 150.0, 0.065, 0.21, 0.82);
  st += starLayer(d, 260.0, 0.045, 0.21, 0.48);
  float dust = fbm3(d * 4.0 + vec3(2.0, 7.0, 1.0));
  vec3 base = vec3(0.00004, 0.00010, 0.00030) + vec3(0.0005, 0.0012, 0.0030) * smoothstep(0.42, 0.78, dust);
  return base + st;
}

vec3 skyColor(vec3 dir, float q){
  float h = dir.y;
  vec3 col = skyBase(h);
  float ext = smoothstep(0.0, 0.16, h);

  float gd = dot(dir, uGalN);
  float band = exp(-gd * gd / 0.045);
  float wide = exp(-gd * gd / 0.20);
  float core = pow(max(dot(dir, uGalC), 0.0), 6.0);
  float dustLo = fbm3(dir * 5.0 + vec3(3.1, 1.7, 8.3));
  float dustHi = 0.5;
  float lane = 0.0;
  if (q > 0.5){
    dustHi = fbm3(dir * 16.0 + vec3(9.2, 4.4, 1.3));
    lane = smoothstep(0.52, 0.74, fbm3(dir * 9.0 + vec3(7.7, 2.2, 5.5)));
  }
  float mw = band * (0.30 + 0.9 * dustLo) * (0.6 + 0.6 * dustHi) * (1.0 - 0.75 * lane);
  vec3 mwCol = mix(vec3(0.050, 0.075, 0.150), vec3(0.24, 0.16, 0.11), clamp(core * 1.6, 0.0, 1.0));
  col += (mwCol * mw * (0.9 + 0.7 * core) + vec3(0.004, 0.008, 0.016) * wide) * ext;

  float g = band * (0.4 + 0.6 * dustLo);
  vec3 st = vec3(0.0);
  st += starLayer(dir,  42.0, 0.10 + 0.20 * g, 0.20, 2.6);
  st += starLayer(dir, 105.0, 0.22 + 0.35 * g, 0.22, 1.5);
  st += starLayer(dir, 250.0, 0.30 + 0.45 * g, 0.24, 0.85);
  col += st * ext * (1.0 - 0.7 * lane * band);

  float land = landMask(dir);
  col = mix(col, vec3(0.0006, 0.0012, 0.0022), land);
  /* below the horizon is only ever seen from underwater, so it is always water column */
  float below = 1.0 - smoothstep(-0.02, -0.002, dir.y);
  col = mix(col, waterColumn(dir), max(uUnderwater, below));
  if (q > 0.5 && uStars > 0.001) col = mix(col, starField(dir), uStars);
  return col;
}
`;

const SKY_VERT = `
varying vec3 vDir;
void main(){
  vDir = position;
  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
}
`;

const SKY_FRAG = `
${GLSL_NOISE}
${GLSL_SKY}
varying vec3 vDir;
void main(){
  vec3 dir = normalize(vDir);
  vec3 c = skyColor(dir, 1.0);
  if (uUnderwater > 0.01) c += marineSnow(dir, 400.0) * 0.55 * uUnderwater * (1.0 - uStars);
  c = finish(c) + (hash21(gl_FragCoord.xy + fract(uTime) * 61.0) - 0.5) / 255.0;
  gl_FragColor = vec4(c, 1.0);
}
`;

/* Water vertex: five sharpened-sine swells travelling toward the camera.
   Amplitude is driven by uAmp, so scrolling calms the sea into glass. */
const WATER_VERT = `
uniform float uTime;
uniform float uAmp;
varying vec3 vWorld;
varying float vDist;

void main(){
  vec3 wp = (modelMatrix * vec4(position, 1.0)).xyz;
  float dist = length(wp - cameraPosition);

  /* Broad, tiny swell only so the surface still reads as an ocean.
     Two vertex waves, no ripple simulation and no normals/reflections. */
  float nearFade = 1.0 - smoothstep(220.0, 900.0, dist);
  float swell =
      sin(wp.x * 0.018 + wp.z * 0.026 + uTime * 0.22) * 0.10 +
      sin(wp.x * -0.012 + wp.z * 0.017 - uTime * 0.16) * 0.07;
  wp.y += swell * nearFade * min(uAmp, 1.0);

  vWorld = wp;
  vDist = dist;
  gl_Position = projectionMatrix * viewMatrix * vec4(wp, 1.0);
}
`;

/* Water fragment: fresnel reflection of the starry sky + bioluminescence.
   Bioluminescence = glowing contour filaments, crest foam, and clustered twinkling plankton sparks. */
const WATER_FRAG = `
uniform float uTime;
uniform float uBio;
uniform float uUnderwater;
uniform float uStars;
varying vec3 vWorld;
varying float vDist;

float cheapHash(vec2 p){
  return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453);
}

void main(){
  vec2 p = vWorld.xz;
  float dist = vDist;

  /* Deep midnight-blue real ocean surface. */
  float horizon = smoothstep(80.0, 1500.0, dist);
  vec3 nearSea = vec3(0.0015, 0.014, 0.032);
  vec3 farSea  = vec3(0.0030, 0.026, 0.060);
  vec3 col = mix(nearSea, farSea, horizon);

  /* Cheap bioluminescence: broad cyan ribbons + sparse glow cells.
     No FBM, no ripple normals, no reflection, no foam, no sparkle passes. */
  float t = uTime * 0.055;
  float ribbonA = sin(p.x * 0.055 + p.y * 0.0 + p.y + p.y + p.z * 0.025 + t);
  float ribbonB = sin(p.x * -0.032 + p.z * 0.047 - t * 0.72 + 1.8);
  float ribbon = smoothstep(1.12, 1.72, ribbonA + ribbonB);

  vec2 cell = floor(p * 0.065);
  float h = cheapHash(cell);
  float patch = smoothstep(0.80, 0.96, h) * (0.58 + 0.42 * sin(t * 2.0 + h * 6.2831));
  float nearGlow = 1.0 - smoothstep(240.0, 900.0, dist);
  float bio = (ribbon * 0.72 + patch * 0.42) * nearGlow * uBio;

  vec3 cyan = vec3(0.00, 0.58, 1.00);
  vec3 hot  = vec3(0.28, 0.96, 1.00);
  col += mix(cyan, hot, ribbon) * bio * 0.72;

  /* From below, keep it dark blue instead of calculating a water-column simulation. */
  if (uUnderwater > 0.01){
    vec3 under = vec3(0.0005, 0.010, 0.025);
    col = mix(col, under, uUnderwater);
  }

  /* The existing sky takes over visually during the final star section. */
  col *= (1.0 - uStars);
  gl_FragColor = vec4(col, 1.0);
}
`;

/* ============================================================
   Three.js scene
   ============================================================ */

let renderer = null, scene, camera, U, skyMesh, waterMesh, pixelRatio = 1;

function buildWaterGeometry(){
  /* polar grid centred on the camera: rings grow geometrically, so vertices stay dense
     where the eye is close and cheap out toward the horizon */
  const perfMobile = window.matchMedia('(max-width: 820px)').matches;
  /* Same ocean shape, fewer samples on small screens where the extra tessellation is not resolvable. */
  const rings = perfMobile ? 72 : 104;
  const segs  = perfMobile ? 64 : 88;
  const r0 = 0.35, R = 2500, sector = 3.67;
  const lq = Math.log(R / r0) / (rings - 1);
  const pos = new Float32Array(rings * (segs + 1) * 3);
  let n = 0;
  for (let r = 0; r < rings; r++){
    const rad = r0 * Math.exp(lq * r);
    for (let s = 0; s <= segs; s++){
      const a = -sector / 2 + sector * (s / segs);
      pos[n++] = Math.sin(a) * rad;
      pos[n++] = 0;
      pos[n++] = -Math.cos(a) * rad;
    }
  }
  const idx = new Uint16Array((rings - 1) * segs * 6);
  let k = 0;
  for (let r = 0; r < rings - 1; r++){
    for (let s = 0; s < segs; s++){
      const a = r * (segs + 1) + s, b = a + 1, c = a + (segs + 1), d = c + 1;
      idx[k++] = a; idx[k++] = c; idx[k++] = b;
      idx[k++] = b; idx[k++] = c; idx[k++] = d;
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setIndex(new THREE.BufferAttribute(idx, 1));
  return geo;
}

function setupGL(){
  renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: false, powerPreference: 'high-performance' });
  renderer.setClearColor(0x01040a, 1);
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(55, 1, 0.1, 6000);
  camera.rotation.order = 'YXZ';

  /* galactic band = great circle through gA (bright core, upper-left) and gB (toward the zenith) */
  const gA = new THREE.Vector3(-0.50, 0.34, -0.79).normalize();
  const gB = new THREE.Vector3( 0.55, 0.80, -0.25).normalize();
  const galN = new THREE.Vector3().crossVectors(gA, gB).normalize();

  U = {
    uTime:    { value: 0 },
    uAmp:     { value: S.amp },
    uBio:     { value: S.bio },
    uReflect: { value: S.reflect },
    uGalN:    { value: galN },
    uGalC:    { value: gA.clone() },
    uHorizon: { value: new THREE.Vector3(0.0045, 0.0115, 0.0235) },
    uZenith:  { value: new THREE.Vector3(0.0006, 0.0014, 0.0040) },
    uUnderwater: { value: 0 },
    uDepth: { value: 0 },
    uStars: { value: 0 }
  };

  skyMesh = new THREE.Mesh(
    new THREE.SphereGeometry(1500, 32, 24),
    new THREE.ShaderMaterial({
      uniforms: U, vertexShader: SKY_VERT, fragmentShader: SKY_FRAG,
      side: THREE.BackSide, depthTest: false, depthWrite: false
    })
  );
  skyMesh.frustumCulled = false;
  skyMesh.renderOrder = -10;
  scene.add(skyMesh);

  const water = new THREE.Mesh(
    buildWaterGeometry(),
    new THREE.ShaderMaterial({
      uniforms: U, vertexShader: WATER_VERT, fragmentShader: WATER_FRAG,
      side: THREE.DoubleSide
    })
  );
  water.frustumCulled = false;
  waterMesh = water;
  scene.add(water);

  const dpr = window.devicePixelRatio || 1;
  pixelRatio = Math.min(dpr, window.innerWidth < 820 ? 0.85 : 1.20);
  renderer.setPixelRatio(pixelRatio);
  resize();
}

function resize(){
  if (!renderer) return;
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setPixelRatio(pixelRatio);
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.fov = camera.aspect < 0.75 ? 68 : camera.aspect < 1.2 ? 60 : 55;
  camera.updateProjectionMatrix();
}

try { setupGL(); }
catch (err){
  console.warn('WebGL unavailable, falling back to a static night gradient.', err);
  renderer = null;
  document.documentElement.classList.add('no-gl');
}

window.addEventListener('resize', resize);
if (!reduceMotion){
  window.addEventListener('pointermove', function (e){
    ptr.tx = (e.clientX / window.innerWidth) * 2 - 1;
    ptr.ty = -((e.clientY / window.innerHeight) * 2 - 1);
  }, { passive: true });
}

/* render loop · V7 performance controller
   Visual design is unchanged. We save GPU work through adaptive resolution,
   frame pacing, background-tab pausing, and section-aware water visibility. */
let T = 0, last = performance.now(), warm = 0, slow = 0, counted = 0;
let pageVisible = !document.hidden;
let lastPaint = 0;
let scrollProgress = 0;
const isPhone = window.matchMedia('(max-width: 820px)').matches;
let targetFrameMs = isPhone ? 1000 / 30 : 0;

document.addEventListener('visibilitychange', function(){
  pageVisible = !document.hidden;
  last = performance.now();
  lastPaint = 0;
}, { passive: true });

function frame(now){
  requestAnimationFrame(frame);
  if (!renderer || !pageVisible) return;

  /* Phones are intentionally paced instead of asking the GPU for uncontrolled 60/120fps.
     This cuts heat/battery use and leaves headroom for scrolling/DOM animation. */
  if (targetFrameMs && now - lastPaint < targetFrameMs) return;
  lastPaint = now;

  const raw = Math.min((now - last) / 1000, 0.1);
  last = now;
  const dt = raw;
  T += dt * (reduceMotion ? 0.35 : 1);

  const ease = Math.min(1, dt * 2.2);
  ptr.x += (ptr.tx - ptr.x) * ease;
  ptr.y += (ptr.ty - ptr.y) * ease;

  camera.position.set(0, S.camY + Math.sin(T * 0.55) * 0.03, 0);
  S.underwater = Math.min(1, Math.max(0, (0.6 - camera.position.y) / 3.0));
  U.uDepth.value = Math.min(1, Math.max(0, -camera.position.y / 18));
  camera.rotation.set(S.pitch + ptr.y * 0.012, S.yaw - ptr.x * 0.03, Math.sin(T * 0.4) * 0.003, 'YXZ');
  skyMesh.position.copy(camera.position);

  U.uTime.value = T;
  U.uAmp.value = S.amp;
  U.uBio.value = S.bio;
  U.uReflect.value = S.reflect;
  U.uUnderwater.value = S.underwater;
  U.uStars.value = S.stars;

  /* Once the final star stage has effectively replaced the ocean, don't shade the water at all. */
  waterMesh.visible = S.stars < 0.985;
  renderer.render(scene, camera);

  /* Measure sustained frame cost, not one-off scroll spikes.
     Lower only WebGL resolution; HTML, logo, coral image and text stay untouched/crisp. */
  if (++warm > 90){
    slow += raw; counted++;
    if (counted >= 50){
      const avg = slow / counted;
      if (avg > 0.040 && pixelRatio > 0.65){
        pixelRatio = Math.max(0.65, pixelRatio - 0.10);
        resize();
      } else if (avg < 0.026 && pixelRatio < (isPhone ? 0.85 : 1.20)){
        pixelRatio = Math.min(isPhone ? 0.85 : 1.20, pixelRatio + 0.05);
        resize();
      }
      slow = 0; counted = 0;
    }
  }
}
requestAnimationFrame(frame);

/* ============================================================
   GSAP · scroll flow between the three sections
   ============================================================ */

gsap.registerPlugin(ScrollTrigger);

const tl = gsap.timeline({
  defaults: { ease: 'none' },
  scrollTrigger: {
    trigger: '#scroller',
    start: 'top top',
    end: 'bottom bottom',
    scrub: reduceMotion ? 0.2 : 1.6,
    snap: reduceMotion ? false : { snapTo: [0, 0.46, 1], duration: { min: 0.45, max: 1.3 }, delay: 0.05, ease: 'power2.inOut' },
    onUpdate: function(self){ scrollProgress = self.progress; }
  }
});

/* section 1 -> section 2: the dive.
   Straight down through the surface into deep water: no yaw, no sideways tilt. The camera sinks (camY),
   the swell settles, the glow fades, and once under, the view eases slightly downward so the surface
   slips out of frame overhead. Submersion, depth and darkness are derived from camY in the render loop. */
tl.to(S, { camY: -16, duration: 1, ease: 'power2.inOut' }, 0)
  .to(S, { pitch: -0.30, duration: 0.7, ease: 'power2.inOut' }, 0.3)
  .to(S, { amp: 0.22, duration: 0.3, ease: 'power1.inOut' }, 0.05)
  .to(S, { bio: 0.4, duration: 0.25, ease: 'power1.inOut' }, 0.05)
  .to(S, { bio: 0, duration: 0.4, ease: 'power1.inOut' }, 0.3)
  .to(S, { reflect: 0.35, duration: 0.3, ease: 'power1.inOut' }, 0.15)
  .to('#hero', { autoAlpha: 0, y: -36, duration: 0.34, ease: 'power1.in' }, 0)
  .fromTo('#track', { autoAlpha: 0, y: 36 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: 'power1.out' }, 0.62)

/* section 2 -> section 3: the last of the light drains away and the star field rises out of the dark */
  .to(S, { camY: -26, pitch: 0.06, duration: 1, ease: 'power1.inOut' }, 1.55)
  .to(S, { stars: 1, duration: 1, ease: 'power1.inOut' }, 1.55)
  .to('#track', { autoAlpha: 0, y: -24, duration: 0.46, ease: 'power1.in' }, 1.62)
  .fromTo('#contact', { autoAlpha: 0, y: 30 }, { autoAlpha: 1, y: 0, duration: 0.5, ease: 'power1.out' }, 2.12);


/* V4: lightweight living-ocean particles + scroll parallax */
const oceanFx = document.querySelector('.ocean-fx');
if (oceanFx) {
  const bubbleCount = window.innerWidth < 700 ? 10 : 18;
  for (let i=0;i<bubbleCount;i++) {
    const b=document.createElement('i'); b.className='bubble';
    const size=3+Math.random()*12;
    b.style.width=size+'px'; b.style.height=size+'px';
    b.style.left=(3+Math.random()*94)+'%';
    b.style.setProperty('--dur',(8+Math.random()*10)+'s');
    b.style.setProperty('--delay',(-Math.random()*16)+'s');
    b.style.setProperty('--sway',((-35+Math.random()*70))+'px');
    oceanFx.appendChild(b);
  }
}
if (!reduceMotion) {

  gsap.to('.track-card', {scrollTrigger:{trigger:'#scroller',start:'28% top',end:'72% bottom',scrub:1.8}, yPercent:-4, ease:'none'});
  gsap.to('.track-title', {scrollTrigger:{trigger:'#scroller',start:'28% top',end:'72% bottom',scrub:1.8}, yPercent:-7, scale:1.025, ease:'none'});
  gsap.to('.ocean-fx', {scrollTrigger:{trigger:'#scroller',start:'28% top',end:'72% bottom',scrub:1.8}, yPercent:-3, ease:'none'});
}

/* opening sequence: the sea surfaces out of black, then the mark and the words */
gsap.timeline({ delay: 0.15 })
  .to('#veil', { opacity: 0, duration: 2.4, ease: 'power2.out', onComplete: function(){ document.getElementById('veil').style.display = 'none'; } })
  .from('#hero .logo, #hero .welcome', { opacity: 0, duration: 1.6, stagger: 0.4, ease: 'power1.out' }, 0.9);


})();
</script>
</body>
